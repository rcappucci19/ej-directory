const FKEYS={email:['email'],cell:['cell'],phone:['cell','ext','direct'],ext:['ext'],extension:['ext'],direct:['direct'],address:['address'],cal:['calendly'],calendly:['calendly'],title:['title','dept'],department:['dept'],dept:['dept'],number:['cell','ext','direct'],call:['cell','ext','direct']};
const FLABELS={email:'Email',cell:'Cell',ext:'Extension',direct:'Direct',address:'Address',calendly:'Calendly',title:'Title',dept:'Department'};

function ini(n){return n.split(' ').filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('')}
function lev(a,b){const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>j===0?i:0));for(let j=1;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n]}

function score(q,p){
  const s=p.name.toLowerCase(),parts=s.split(' ');
  if(s===q)return 100;if(parts.includes(q))return 90;if(s.startsWith(q))return 80;if(s.includes(q))return 70;
  for(const w of parts){if(w.startsWith(q))return 65;}
  for(const w of parts){if(q.length>2&&lev(q,w)===1)return 50;}
  for(const w of parts){if(q.length>3&&lev(q,w)===2)return 30;}
  return 0;
}

function card(p,fkeys){
  const keys=fkeys||['cell','ext','direct','email','address','calendly','title','dept'];
  let f='';
  for(const k of keys){
    const v=p[k];if(!v)continue;
    let d=v;
    if(k==='email')d=`<a href="mailto:${v}">${v}</a>`;
    if(k==='calendly')d=`<a href="${v}" target="_blank">${v}</a>`;
    f+=`<div class="field"><span class="fl">${FLABELS[k]||k}</span><span class="fv">${d}</span></div>`;
  }
  if(!f)f='<div class="hint">No data for that field.</div>';
  return `<div class="card"><div class="card-head"><div class="avatar">${ini(p.name)}</div><div><div class="card-name">${p.name}</div><div class="card-title">${p.title}</div></div></div>${f}</div>`;
}

let pm=null,pf=null;
function selectMatch(i){document.getElementById('results').innerHTML=card(pm[i],pf);pm=null;pf=null}

function render(raw){
  const out=document.getElementById('results');
  if(!raw.trim()){out.innerHTML='';return;}
  const input=raw.trim().toLowerCase();
  let fkey=null,nq=input;
  for(const k of Object.keys(FKEYS)){
    if(new RegExp('\\b'+k+'s?\\b','i').test(input)){fkey=k;nq=input.replace(new RegExp('\\b'+k+'s?\\b','i'),'').trim();break;}
  }
  const fkeys=fkey?FKEYS[fkey]:null;
  const scored=DIR.map(p=>({p,s:score(nq,p)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const matches=scored.map(x=>x.p);
  if(!matches.length){out.innerHTML='<div class="hint">No match found. Try a full or partial name.</div>';return;}
  if(matches.length===1){out.innerHTML=card(matches[0],fkeys);return;}
  if(scored[0].s>=65&&matches.length<=8){
    pm=matches;pf=fkeys;
    let h='<div class="hint">Multiple matches. Which one?</div>';
    matches.forEach((m,i)=>h+=`<button class="mbtn" onclick="selectMatch(${i})">${m.name} &middot; ${m.title}</button>`);
    out.innerHTML=h;return;
  }
  out.innerHTML=card(matches[0],fkeys);
}

const inp=document.getElementById('search');
let t;
inp.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>render(inp.value),80);});
inp.focus();
